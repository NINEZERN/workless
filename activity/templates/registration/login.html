{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf5eb">
  <title>Вход · Workless</title>
  <link rel="stylesheet" href="{% static 'activity/terminal.css' %}">
</head>
<body class="clock-page">
  <main class="shell shell--login">
    <header class="terminal-header">
      <a class="back-link" href="{% url 'home' %}">← К терминалу</a>
    </header>
    <section class="terminal" aria-labelledby="login-title">
      <div class="screen login-screen">
        <h1 id="login-title">Workless</h1>
      </div>
      <form class="controls login-form" method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        {% if form.non_field_errors %}
          <div class="login-errors" role="alert">{{ form.non_field_errors }}</div>
        {% endif %}
        {% for field in form %}
          <div class="login-field">
            {% if field.name == 'username' %}
              <label for="{{ field.id_for_label }}">Логин</label>
            {% else %}
              <label for="{{ field.id_for_label }}">Пароль</label>
            {% endif %}
            {{ field }}
            {{ field.errors }}
          </div>
        {% endfor %}
        <button class="action" type="submit">Войти</button>
      </form>
    </section>
  </main>
</body>
</html>
